<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidelight · the sea, live</title>
<meta name="theme-color" content="#070b1f">
<style>
:root{--night:#070b1f;--dusk:#1a1c47;--foam:#dbf0f2;--sand:#f7e6c7;--ink:#241f1a;--lamp:#ffdb8f}
html,body{margin:0;height:100%;background:var(--night);color:var(--foam);font:16px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;padding:4vh 4vw}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:4vw}
h1{margin:0;font:600 clamp(28px,3.4vw,54px)/1 "New York","Iowan Old Style",Georgia,serif}
.line{margin:1.2vh 0 0;max-width:60vw;font:italic 400 clamp(22px,3vw,46px)/1.25 "New York","Iowan Old Style",Georgia,serif;opacity:.92;text-wrap:balance;transition:opacity .8s}
.counts{margin-top:1.6vh;font-size:clamp(14px,1.3vw,20px);opacity:.65;font-variant-numeric:tabular-nums}
.qr{background:#fff;border-radius:18px;padding:14px;width:clamp(120px,14vw,220px);height:clamp(120px,14vw,220px);box-sizing:border-box;display:grid;place-items:center;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.qrwrap{display:grid;justify-items:center;gap:1vh;font-size:clamp(13px,1.2vw,18px);opacity:.9;text-align:center}
.qrwrap b{font-weight:600}
.event{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%) scale(.96);padding:14px 26px;border-radius:999px;background:var(--lamp);color:var(--ink);font:600 clamp(16px,1.8vw,28px) system-ui;opacity:0;transition:opacity .35s,transform .35s;box-shadow:0 0 60px rgba(255,219,143,.5);pointer-events:none}
.event.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.foot{font-size:clamp(11px,1vw,15px);opacity:.45;text-align:center}
@media (prefers-reduced-motion:reduce){canvas{filter:none}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top">
    <div>
      <h1>Tidelight</h1>
      <p class="line" id="line">Listening to the water…</p>
      <p class="counts" id="counts"></p>
    </div>
    <div class="qrwrap"><div class="qr" id="qr"></div><div><b>Scan to drop a bottle</b><br>one true sentence · no name</div></div>
  </div>
  <div></div>
  <p class="foot">Nobody's words are shown on this screen. Only the glass. A stranger reads each bottle, one at a time, on their own phone.</p>
</div>
<div class="event" id="event"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API="https://qjyhswvteapeuxjbskke.supabase.co/functions/v1/api";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqeWhzd3Z0ZWFwZXV4amJza2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjA5MTIsImV4cCI6MjEwNDA5NjkxMn0.3OzbeVGp3qnIVmvIkVmdiHf9LXJ2EGSR0U_WYvcuSwU";
const GLASS={storm:"#7390b8",deep:"#6169d6",ember:"#ed7052",fog:"#adbdb3",kelp:"#45ad8f",sun:"#f5bd52"};
new QRCode(document.getElementById("qr"),{text:"https://adam0thman.github.io/tidelight-web/",width:512,height:512,correctLevel:QRCode.CorrectLevel.M});

const c=document.getElementById("c"),ctx=c.getContext("2d");
let W=0,H=0,DPR=1;function size(){DPR=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*DPR;H=c.height=innerHeight*DPR}size();addEventListener("resize",size);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

let state={mood:"deep",lights:0},bottles=[],known=new Set(),ripples=[],flare=0,beamAngle=-2.6,first=true;
const stars=[...Array(140)].map((_,i)=>({x:Math.random(),y:Math.random()*.55,r:.6+Math.random()*1.6,p:Math.random()*6}));

function hex(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function waveY(x,t,l){const base=H*(.58+l*.12),amp=(7+l*4)*DPR,sp=.9-l*.2,k=(.012+l*.003)/DPR;return base+amp*Math.sin(x*k+t*sp+l*1.7)+amp*.5*Math.sin(x*k*2.3-t*sp*1.4+l)}

function draw(now){
  const t=now/1000;const g=ctx.createLinearGradient(0,0,0,H*.62);g.addColorStop(0,"#070b1f");g.addColorStop(.7,"#1a1c47");g.addColorStop(1,hex(GLASS[state.mood]||GLASS.deep,.25));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){const tw=.5+.5*Math.sin(t*(.8+s.x*1.5)+s.p);ctx.fillStyle=`rgba(255,255,255,${.25+.55*tw})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*DPR,0,7);ctx.fill()}
  // moon
  const mx=W*.66,my=H*.40;const mg=ctx.createRadialGradient(mx,my,20*DPR,mx,my,120*DPR);mg.addColorStop(0,"rgba(255,219,143,.35)");mg.addColorStop(1,"rgba(255,219,143,0)");ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,120*DPR,0,7);ctx.fill();
  ctx.fillStyle="#faf3db";ctx.beginPath();ctx.arc(mx,my,34*DPR,0,7);ctx.fill();ctx.fillStyle="rgba(7,11,31,.93)";ctx.beginPath();ctx.arc(mx+16*DPR,my-6*DPR,32*DPR,0,7);ctx.fill();
  // lighthouse
  const lx=W*.86,baseY=H*.58;ctx.fillStyle="#070b1f";ctx.beginPath();ctx.moveTo(lx-150*DPR,baseY+50*DPR);ctx.quadraticCurveTo(lx+10*DPR,baseY-70*DPR,lx+170*DPR,baseY+50*DPR);ctx.closePath();ctx.fill();
  const tg=ctx.createLinearGradient(lx-30*DPR,0,lx+30*DPR,0);tg.addColorStop(0,"#333654");tg.addColorStop(1,"#1c1f38");ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(lx-20*DPR,baseY-200*DPR);ctx.lineTo(lx+20*DPR,baseY-200*DPR);ctx.lineTo(lx+36*DPR,baseY-8*DPR);ctx.lineTo(lx-36*DPR,baseY-8*DPR);ctx.closePath();ctx.fill();
  ctx.fillStyle="#9e3838";for(let i=0;i<3;i++){const y=baseY-170*DPR+i*56*DPR,w=(22+i*4)*DPR;ctx.fillRect(lx-w,y,w*2,14*DPR)}
  ctx.fillStyle="#070b1f";ctx.fillRect(lx-30*DPR,baseY-214*DPR,60*DPR,12*DPR);ctx.fillStyle=hex("#ffdb8f",.7);ctx.fillRect(lx-14*DPR,baseY-240*DPR,28*DPR,26*DPR);ctx.fillStyle="#070b1f";ctx.fillRect(lx-20*DPR,baseY-252*DPR,40*DPR,12*DPR);
  const lamp={x:lx,y:baseY-227*DPR};const ang=reduce?-2.4:t*.35;ctx.globalCompositeOperation="lighter";
  const bg=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,900*DPR);bg.addColorStop(0,"rgba(255,219,143,.5)");bg.addColorStop(.4,"rgba(255,219,143,.12)");bg.addColorStop(1,"rgba(255,219,143,0)");
  ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(lamp.x,lamp.y);ctx.lineTo(lamp.x+Math.cos(ang-.1)*2000*DPR,lamp.y+Math.sin(ang-.1)*2000*DPR);ctx.lineTo(lamp.x+Math.cos(ang+.1)*2000*DPR,lamp.y+Math.sin(ang+.1)*2000*DPR);ctx.closePath();ctx.fill();
  if(flare>0){const fg=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,520*DPR);fg.addColorStop(0,`rgba(255,219,143,${.8*flare})`);fg.addColorStop(1,"rgba(255,219,143,0)");ctx.fillStyle=fg;ctx.beginPath();ctx.arc(lamp.x,lamp.y,520*DPR,0,7);ctx.fill();flare=Math.max(0,flare-.006)}
  ctx.globalCompositeOperation="source-over";
  // water
  const cols=["#0d3b52","#0a2a45","#070b1f"];
  for(let l=0;l<3;l++){ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8*DPR)ctx.lineTo(x,waveY(x,reduce?0:t,l));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=cols[l];ctx.fill();
    ctx.beginPath();for(let x=0;x<=W;x+=8*DPR){const y=waveY(x,reduce?0:t,l);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=`rgba(219,240,242,${.18-l*.05})`;ctx.lineWidth=1.2*DPR;ctx.stroke();
    if(l===0)drawBottles(t)}
  // ripples
  ripples=ripples.filter(r=>t-r.t<1.8);for(const r of ripples){const k=(t-r.t)/1.8;for(let i=0;i<3;i++){const rad=(10+k*120+i*22)*DPR;ctx.strokeStyle=`rgba(219,240,242,${(1-k)*.4/(i+1)})`;ctx.lineWidth=1.4*DPR;ctx.beginPath();ctx.ellipse(r.x,r.y,rad,rad*.38,0,0,7);ctx.stroke()}}
  requestAnimationFrame(draw);
}
function drawBottles(t){
  const lane=W+80*DPR;
  bottles.forEach((b,i)=>{
    const speed=(9+((i*137.5/7)%1)*8)*DPR;let x=((t*speed/lane+((i*.618)%1))%1)*lane-40*DPR;
    let y=waveY(x,reduce?0:t,0)+8*DPR;let s=1;
    if(b.drop!==undefined){const k=Math.min(1,(t-b.drop)/1.1);if(k<1){x=b.dx;y=-60*DPR+(waveY(b.dx,t,0)+60*DPR)*(k*k);s=1.6-.6*k}else{if(!b.splashed){b.splashed=true;ripples.push({x:b.dx,y:waveY(b.dx,t,0),t})}b.drop=undefined}}
    const slope=waveY(x+6*DPR,t,0)-waveY(x-6*DPR,t,0);const rot=Math.atan2(slope,12*DPR)+Math.sin(t*1.3+i)*.12;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);const w=16*DPR,h=34*DPR;
    ctx.fillStyle=hex(GLASS[b.mood]||GLASS.deep,.92);ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=DPR;
    ctx.beginPath();ctx.moveTo(-w*.14,-h*.78);ctx.lineTo(-w*.14,-h*.58);ctx.quadraticCurveTo(-w/2,-h*.58,-w/2,-h*.44);ctx.lineTo(-w/2,h*.1);ctx.quadraticCurveTo(-w/2,h*.22,-w*.3,h*.22);ctx.lineTo(w*.3,h*.22);ctx.quadraticCurveTo(w/2,h*.22,w/2,h*.1);ctx.lineTo(w/2,-h*.44);ctx.quadraticCurveTo(w/2,-h*.58,w*.14,-h*.58);ctx.lineTo(w*.14,-h*.78);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle="#b38352";ctx.fillRect(-w*.17,-h*.86,w*.34,h*.1);
    if(!b.synthetic){ctx.fillStyle="rgba(255,219,143,.9)";ctx.beginPath();ctx.arc(0,-h*.95,2.4*DPR,0,7);ctx.fill()}
    ctx.restore();
  });
}
let evT=null;function say(msg){const e=document.getElementById("event");e.textContent=msg;e.classList.add("on");clearTimeout(evT);evT=setTimeout(()=>e.classList.remove("on"),3200)}

async function poll(){
  try{
    const r=await fetch(API+"/sea?keeper_id=00000000-0000-4000-8000-00000000f1de",{headers:{apikey:ANON,Authorization:"Bearer "+ANON}});
    const j=await r.json();const sea=j.sea;
    const lineEl=document.getElementById("line");if(lineEl.textContent!==sea.line){lineEl.style.opacity=0;setTimeout(()=>{lineEl.textContent=sea.line;lineEl.style.opacity=.92},800)}
    document.getElementById("counts").textContent=`${sea.drifting} bottles drifting · ${sea.live_today} live today · ${sea.lights} lights sent`;
    const recent=(j.recent||[]).slice().reverse();const t=performance.now()/1000;
    for(const b of recent){if(!known.has(b.id)){known.add(b.id);const nb={id:b.id,mood:b.mood,synthetic:b.synthetic};if(!first){nb.drop=t;nb.dx=W*(.15+Math.random()*.6);say(b.synthetic?"A bottle drifted in.":"Someone in the room just dropped a bottle.")}bottles.push(nb)}}
    if(bottles.length>24)bottles=bottles.slice(-24);
    if(!first&&sea.lights>state.lights){flare=1;say("A light just landed on someone's bottle.")}
    state={mood:sea.mood,lights:sea.lights};first=false;
  }catch(e){document.getElementById("counts").textContent="The sea didn't answer. Trying again…"}
  setTimeout(poll,4000);
}
poll();requestAnimationFrame(draw);
</script></body></html>
